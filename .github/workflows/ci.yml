name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }   # 3.8 is not on the 24.04 image
          - { os: ubuntu-latest, python: '3.9' }
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: unit tests (codec)
        run: python tests/test_core.py
      - name: end-to-end tests
        run: python tests/test_e2e.py
      - name: regression tests
        run: python tests/test_regressions.py
      - name: pytest
        run: python -m pytest -q

  walkthrough:
    name: cli walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: record, summarise, sets, dump, html
        run: |
          set -eux
          tracewire --version
          python -m tracewire --version
          tracewire record examples/demo_program.py -o demo.trace
          tracewire summary demo.trace
          tracewire summary demo.trace --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['markers']>0; assert d['functions']"
          tracewire sets demo.trace --name recursion --predicate "marker.function == 'factorial'"
          tracewire sets demo.trace --name big --important --predicate "marker.has('total') and marker.get('total') > 10"
          tracewire dump demo.trace > /dev/null
          tracewire dump demo.trace --index 5
          tracewire html demo.trace -o demo.html
          test -s demo.html
          grep -q '"markers"' demo.html
      - name: a failing program still yields a trace and a non-zero exit
        run: |
          set +e
          printf 'def f():\n    raise ValueError("boom")\n\nf()\n' > boom.py
          tracewire record boom.py -o boom.trace
          rc=$?
          set -e
          test -s boom.trace
          test "$rc" -ne 0
          tracewire dump boom.trace --index 999 || true
      - name: corrupt input is rejected, not silently accepted
        run: |
          set +e
          head -c 40 demo.trace > broken.trace
          tracewire summary broken.trace
          rc=$?
          set -e
          test "$rc" -ne 0

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build twine
      - name: build sdist and wheel
        run: python -m build
      - name: twine check
        run: python -m twine check dist/*
      - name: install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/tracewire --version
          /tmp/venv/bin/python -c "import tracewire, tracewire.core; print(tracewire.__version__)"
      - name: license files present
        run: |
          test -s LICENSE
          test -s COMMERCIAL.md
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
      - name: no artifacts or secrets tracked
        run: |
          if git ls-files | grep -Eq '\.(trace|html)$|\.sets\.json$|__pycache__'; then
            echo "generated artifacts are tracked"; exit 1
          fi
          echo clean
